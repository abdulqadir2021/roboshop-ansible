- name: Frontend Playbook
  hosts: all
  become: yes
  tasks:
    - name: Disable Default Nginx
      ansible.builtin.shell: dnf module disable nginx

    - name: Enable Nginx 24 Version
      ansible.builtin.shell: dnf module enable nginx:1.24

    - name: Install Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Copy nginx config file
      ansible.builtin.copy:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf

    - name: Start nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: started



